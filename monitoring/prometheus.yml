global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alert_rules.yml
scrape_configs:
  - job_name: multi-fog
    scrape_interval: 15s
    static_configs:
      - targets: ['fog-metrics-exporter:8000']
  - job_name: postgres
    scrape_interval: 15s
    static_configs:
      - targets: ['fog-postgres-exporter:9187']
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
