# Passerelle de developpement, local uniquement. Ne pas exposer publiquement sans auth.
services:
  dashboard-gateway:
    build:
      context: .
      dockerfile: cloud/dashboard_gateway/Dockerfile
    environment:
      ORCHESTRATOR_URL: http://cloud-orchestrator:8000
      ORCHESTRATOR_API_TOKEN: ${ORCHESTRATOR_API_TOKEN:?Définir ORCHESTRATOR_API_TOKEN dans .env.cloud}
      FOG_A_URL: http://fog-a:8000
      FOG_B_URL: http://fog-b:8000
      FOG_C_URL: http://fog-c:8000
    ports:
      - "127.0.0.1:18083:8000"
    networks:
      - default
      - fog_network
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

networks:
  fog_network:
    external: true
    name: ${FOG_NETWORK_NAME:?Définir FOG_NETWORK_NAME dans .env.cloud}
